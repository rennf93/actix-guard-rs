[workspace]
members = ["examples/simple_app", "examples/advanced_app"]

[package]
name = "actix-guard-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Application-layer security middleware for actix-web, powered by the guard-core-rs engine. Part of the guard ecosystem."
license = "MIT OR Apache-2.0"
repository = "https://github.com/rennf93/actix-guard-rs"
readme = "README.md"
keywords = ["security", "middleware", "api", "actix", "actix-web"]
categories = ["web-programming"]

[lib]
name = "actix_guard_rs"

[dependencies]
actix-web = { version = "4", default-features = false }
bytes = "1.10"
# Stream trait for polling the request payload directly (Payload is Unpin).
futures-core = { version = "0.3", default-features = false }
# TODO(engine): switch to the versioned crates.io dependency once guard-core-rs
# is tagged and published. The path points at the engine crate inside the
# guard-core-rs workspace; a sibling checkout is required for local builds and
# CI checks out one (see .github/workflows/ci.yml).
guard-core-engine = { path = "../guard-core-rs/crates/guard-core-engine", version = "0.0.1" }

[dev-dependencies]
actix-web = { version = "4", features = ["macros"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all                     = { level = "deny", priority = -1 }
pedantic                = { level = "warn", priority = -1 }
missing_errors_doc      = "allow"
missing_panics_doc      = "allow"
module_name_repetitions = "allow"
